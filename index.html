<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --text-muted: #78716c;
      --accent: #44403c;
      --accent-light: #f5f5f4;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Login Overlay */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #login-overlay.hidden {
      display: none;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow-hover);
    }

    .login-box h2 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .login-box input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 1rem;
      background: var(--bg);
      color: var(--text);
    }

    .login-box input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .login-error {
      color: #b91c1c;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
      text-align: center;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-login:hover { opacity: 0.85; }

    .btn-logout {
      padding: 0.4rem 0.85rem;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.12s;
    }

    .btn-logout:hover { background: var(--accent-light); }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .emoji-decoration {
      font-style: normal;
      font-size: 1.1em;
      margin-right: 0.35em;
    }

    .column-header h3 .emoji-decoration {
      font-size: 1em;
    }

    header .header-left {
      text-align: center;
      flex: 1;
    }

    header h1 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    /* Main */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    main.hidden {
      display: none;
    }

    /* Add Form */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
    }

    .add-form h2 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .form-row input,
    .form-row select {
      padding: 0.6rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s;
    }

    .form-row input:focus,
    .form-row select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-row input::placeholder {
      color: var(--text-muted);
    }

    .form-row .input-title { flex: 2; min-width: 160px; }
    .form-row .input-author { flex: 1.5; min-width: 120px; }
    .form-row .input-status { flex: 1; min-width: 130px; }

    .btn-add {
      padding: 0.6rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-add:hover { opacity: 0.85; }

    /* Board */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr; }
    }

    .column {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .column-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .column-header h3 {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1rem;
    }

    .count {
      background: var(--accent-light);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.15rem 0.55rem;
      border-radius: 20px;
    }

    .column-body {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem 1rem;
      font-style: italic;
    }

    /* Book Card */
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      transition: box-shadow 0.15s;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }

    .card-author {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }

    .card-read-date {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-sm {
      padding: 0.3rem 0.65rem;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      transition: background 0.12s;
    }

    .btn-sm:hover { background: var(--accent-light); }
    .btn-sm.delete:hover { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

    /* Progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .progress-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 70px;
    }

    .progress-bar-container {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.2s;
    }

    .progress-value {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 35px;
      text-align: right;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer.hidden {
      display: none;
    }
  </style>
</head>
<body>

<!-- Login Overlay -->
<div id="login-overlay">
  <div class="login-box">
    <h2>📚 Bookshelf</h2>
    <p>Enter the shared password to continue</p>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>
</div>

<header>
  <div class="header-left">
    <h1>📚 Bookshelf</h1>
    <p>Track your reading journey</p>
  </div>
  <button class="btn-logout" id="btn-logout">Sign Out</button>
</header>

<main id="main-content">
  <form class="add-form" id="addForm">
    <h2>➕ Add a book</h2>
    <div class="form-row">
      <input type="text" class="input-title" id="inputTitle" placeholder="Book title" required>
      <input type="text" class="input-author" id="inputAuthor" placeholder="Author (optional)">
      <select class="input-status" id="inputStatus">
        <option value="reading">Reading Now</option>
        <option value="to-read">To Read</option>
        <option value="finished">Finished</option>
      </select>
      <button type="submit" class="btn-add">Add Book</button>
    </div>
  </form>

  <div class="board">
    <div class="column">
      <div class="column-header">
        <h3>📖 Reading Now</h3>
        <span class="count" id="count-reading">0</span>
      </div>
      <div class="column-body" id="col-reading"></div>
    </div>

    <div class="column">
      <div class="column-header">
        <h3>🔖 To Read</h3>
        <span class="count" id="count-to-read">0</span>
      </div>
      <div class="column-body" id="col-to-read"></div>
    </div>

    <div class="column">
      <div class="column-header">
        <h3>✅ Finished</h3>
        <span class="count" id="count-finished">0</span>
      </div>
      <div class="column-body" id="col-finished"></div>
    </div>
  </div>
</main>

<footer id="footer">📚 Books are synced to Firestore. Made with love by pacocp.</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  // === CONFIGURATION ===
  const BOOK_PASSWORD = 'YOUR_BOOK_PASSWORD';

  const FIREBASE_CONFIG = {
    apiKey: 'YOUR_FIREBASE_API_KEY',
    authDomain: 'YOUR_FIREBASE_AUTH_DOMAIN',
    projectId: 'YOUR_FIREBASE_PROJECT_ID',
    storageBucket: 'YOUR_FIREBASE_STORAGE_BUCKET',
    messagingSenderId: 'YOUR_FIREBASE_MESSAGING_SENDER_ID',
    appId: 'YOUR_FIREBASE_APP_ID'
  };

  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  const BOOKS_REF = db.collection('books').doc('data');

  // === SESSION ===
  const AUTH_KEY = 'booklist_auth';

  function isAuthenticated() {
    return sessionStorage.getItem(AUTH_KEY) === 'true';
  }

  function setAuthenticated(value) {
    sessionStorage.setItem(AUTH_KEY, value ? 'true' : 'false');
  }

  function logout() {
    setAuthenticated(false);
    checkAuth();
  }

  function validatePassword(password) {
    return password === BOOK_PASSWORD;
  }

  function checkAuth() {
    if (isAuthenticated()) {
      showApp();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    document.getElementById('login-overlay').classList.remove('hidden');
    document.getElementById('main-content').classList.add('hidden');
    document.getElementById('footer').classList.add('hidden');
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  function showApp() {
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    document.getElementById('footer').classList.remove('hidden');
    render();
  }

  // === LOGIN FORM ===
  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const password = document.getElementById('login-password').value;
    document.getElementById('login-error').style.display = 'none';

    if (validatePassword(password)) {
      setAuthenticated(true);
      showApp();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  });

  document.getElementById('btn-logout').addEventListener('click', logout);

  // === DATA (localStorage JSON, organized by categories) ===
  const STORAGE_KEY = 'booklist_data';

  function getDefaultData() {
    return { reading: [], 'to-read': [], finished: [] };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : getDefaultData();
    } catch {
      return getDefaultData();
    }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function addBook(title, author, status) {
    const data = loadData();
    const book = {
      id: crypto.randomUUID(),
      title,
      author: author || '',
      status,
      progress: 0,
      created_at: new Date().toISOString(),
      read_date: null
    };
    data[status].push(book);
    saveData(data);
    render();
    scheduleSync();
  }

  function moveBook(id, newStatus) {
    const data = loadData();
    let book = null;
    for (const category of ['reading', 'to-read', 'finished']) {
      const idx = data[category].findIndex(b => b.id === id);
      if (idx !== -1) {
        book = data[category].splice(idx, 1)[0];
        break;
      }
    }
    if (!book) return;
    book.status = newStatus;
    if (newStatus === 'finished') {
      book.progress = 100;
      book.read_date = new Date().toISOString().split('T')[0];
    }
    if (newStatus === 'reading' && !book.progress) {
      book.progress = 0;
    }
    data[newStatus].push(book);
    saveData(data);
    render();
    scheduleSync();
  }

  function updateProgress(id, progress) {
    const data = loadData();
    for (const category of ['reading', 'to-read', 'finished']) {
      const book = data[category].find(b => b.id === id);
      if (book) {
        book.progress = progress;
        break;
      }
    }
    saveData(data);
    render();
    scheduleSync();
  }

  function deleteBook(id) {
    const data = loadData();
    for (const category of ['reading', 'to-read', 'finished']) {
      const idx = data[category].findIndex(b => b.id === id);
      if (idx !== -1) {
        data[category].splice(idx, 1);
        break;
      }
    }
    saveData(data);
    render();
    scheduleSync();
  }

  // === FIRESTORE SYNC ===
  let syncTimeout = null;
  function scheduleSync() {
    if (syncTimeout) clearTimeout(syncTimeout);
    syncTimeout = setTimeout(saveToFirestore, 2000);
  }

  async function saveToFirestore() {
    const data = loadData();
    try {
      await BOOKS_REF.set(data);
    } catch (e) {
      console.error('Firestore save failed:', e);
    }
  }

  async function loadFromFirestore() {
    try {
      const snap = await BOOKS_REF.get();
      if (snap.exists) {
        saveData(snap.data());
        if (isAuthenticated()) render();
      }
    } catch (e) {
      console.error('Firestore load failed:', e);
    }
  }

  // === ACTIONS ===
  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function buildMoveButtons(currentStatus, bookId) {
    const options = [
      { value: 'reading', label: 'Reading' },
      { value: 'to-read', label: 'To Read' },
      { value: 'finished', label: 'Finished' },
    ];
    return options
      .filter(o => o.value !== currentStatus)
      .map(o => `<button class="btn-sm" data-id="${bookId}" data-status="${o.value}">${o.label}</button>`)
      .join('');
  }

  function buildProgressUI(book) {
    if (book.status !== 'reading') return '';
    return `
      <div class="progress-row">
        <span class="progress-label">Progress</span>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" style="width: ${book.progress || 0}%"></div>
        </div>
        <input type="number" class="progress-input" data-id="${book.id}"
          value="${book.progress || 0}" min="0" max="100"
          style="width: 45px; padding: 0.2rem 0.3rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.75rem; text-align: center;">
        <span class="progress-value">${book.progress || 0}%</span>
      </div>
    `;
  }

  // === RENDER ===
  function render() {
    const data = loadData();
    const columns = data;

    for (const [status, col] of Object.entries(columns)) {
      document.getElementById(`count-${status}`).textContent = col.length;
      const el = document.getElementById(`col-${status}`);
      el.innerHTML = '';

      if (col.length === 0) {
        el.innerHTML = '<p class="empty-state">📭 No books here yet</p>';
        continue;
      }

      col.forEach(book => {
        const card = document.createElement('div');
        card.className = 'card';
        let readDateHtml = '';
        if (book.read_date) {
          readDateHtml = `<div class="card-read-date">✅ Read on ${esc(book.read_date)}</div>`;
        }
        card.innerHTML = `
          <div class="card-title">${esc(book.title)}</div>
          ${book.author ? `<div class="card-author">${esc(book.author)}</div>` : ''}
          ${readDateHtml}
          <div class="card-actions">
            ${buildMoveButtons(book.status, book.id)}
            <button class="btn-sm delete" data-id="${book.id}">Remove</button>
          </div>
          ${buildProgressUI(book)}
        `;
        el.appendChild(card);
      });
    }
  }

  // === EVENT DELEGATION ===
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn-sm');
    if (!btn) return;

    if (btn.classList.contains('delete')) {
      deleteBook(btn.dataset.id);
    } else if (btn.dataset.id && btn.dataset.status) {
      moveBook(btn.dataset.id, btn.dataset.status);
    }
  });

  document.addEventListener('input', e => {
    if (e.target.classList.contains('progress-input')) {
      const id = e.target.dataset.id;
      const progress = Math.min(100, Math.max(0, parseInt(e.target.value) || 0));
      e.target.value = progress;
      updateProgress(id, progress);
    }
  });

  // === FORM ===
  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('inputTitle').value.trim();
    const author = document.getElementById('inputAuthor').value.trim();
    const status = document.getElementById('inputStatus').value;
    if (!title) return;
    addBook(title, author, status);
    e.target.reset();
  });

  // === INIT ===
  checkAuth();
  loadFromFirestore();
</script>

</body>
</html>
